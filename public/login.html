<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Health Monitoring System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="/css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1b263b 0%, #0d1b2a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 15px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }
    .login-header {
      background-color: var(--primary-color);
      color: #fff;
      padding: 30px 20px;
      text-align: center;
    }
    .login-header i {
      font-size: 3rem;
      margin-bottom: 10px;
    }
    .login-body {
      padding: 30px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="bi bi-heart-pulse-fill"></i>
        <h4 class="m-0 fw-bold">Health Monitor NE</h4>
        <p class="m-0 text-white-50 small">Water-Borne Disease Warning System</p>
      </div>
      <div class="login-body">
        
        <div id="alert-container" class="alert d-none" role="alert"></div>

        <form id="login-form">
          <!-- Role Selection -->
          <div class="mb-3">
            <label class="form-label fw-semibold">Select Role</label>
            <div class="d-flex gap-3">
              <div class="form-check flex-fill">
                <input class="form-check-input" type="radio" name="role" id="role-worker" value="health_worker" checked>
                <label class="form-check-label" for="role-worker">
                  Health Worker
                </label>
              </div>
              <div class="form-check flex-fill">
                <input class="form-check-input" type="radio" name="role" id="role-admin" value="admin">
                <label class="form-check-label" for="role-admin">
                  Administrator
                </label>
              </div>
            </div>
          </div>

          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
              <input type="text" class="form-control" id="username" placeholder="Enter username" required autocomplete="username">
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="password" class="form-label fw-semibold">Password</label>
              <a href="#" onclick="showForgotPassword()" class="small text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
            </div>
          </div>

          <!-- Remember Me -->
          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label text-muted small" for="rememberMe">Remember me on this device</label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-custom-primary w-100 py-2.5">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
          </button>
        </form>

        <div class="text-center mt-4">
          <a href="/public.html" class="text-decoration-none small text-secondary">
            <i class="bi bi-arrow-left"></i> Back to Public Dashboard
          </a>
        </div>

      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold"><i class="bi bi-info-circle-fill text-primary"></i> Forgot Password Info</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>For security, password resets are handled manually by the system administrator.</p>
          <div class="alert alert-info">
            <i class="bi bi-envelope-fill me-1"></i> Contact Admin at: <strong>admin@health.ne.gov.in</strong>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Handle form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      const alertContainer = document.getElementById('alert-container');
      alertContainer.classList.add('d-none');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, role, rememberMe })
        });
        
        const data = await response.json();
        
        if (data.success) {
          alertContainer.className = 'alert alert-success';
          alertContainer.innerHTML = `<i class="bi bi-check-circle-fill"></i> ${data.message} Redirecting...`;
          alertContainer.classList.remove('d-none');
          
          setTimeout(() => {
            if (role === 'admin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/worker.html';
            }
          }, 1000);
        } else {
          alertContainer.className = 'alert alert-danger';
          alertContainer.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> ${data.message}`;
          alertContainer.classList.remove('d-none');
        }
      } catch (err) {
        console.error('Error during fetch:', err);
        alertContainer.className = 'alert alert-danger';
        alertContainer.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> Connection error. Try again later.`;
        alertContainer.classList.remove('d-none');
      }
    });

    function showForgotPassword() {
      const modal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
      modal.show();
    }
  </script>
</body>
</html>
